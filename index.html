<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO 3D CAT TAROT</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Three.js 引擎 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 复古 CRT 屏幕扫描线及暗角光效叠层 -->
  <div class="crt-overlay"></div>

  <!-- 3D 渲染画布容器 -->
  <div id="webgl-container"></div>

  <!-- 交互 UI 悬浮层 -->
  <div class="ui-layer">
    <header class="retro-header">
      <h1 class="pixel-text">★ CAT TAROT 2000 ★</h1>
      <p class="pixel-sub">PRESS [DRAW] TO REVEAL DESTINY</p>
    </header>

    <div class="controls">
      <input type="text" id="wishInput" class="pixel-input" placeholder="ENTER YOUR QUESTION..." maxlength="30" />
      <div class="btn-group">
        <button id="drawBtn" class="pixel-btn">DRAW CARD</button>
        <button id="resetBtn" class="pixel-btn secondary" disabled>RESET</button>
      </div>
    </div>

    <!-- 牌意显示面板 -->
    <div id="readingBox" class="reading-box hidden">
      <div class="badge" id="cardTag">THE LOVERS (正位)</div>
      <p id="cardDesc" class="reading-content">恶魔与天使相拥，极性统一，羁绊诞生。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
