<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO 3D CAT TAROT</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Three.js 引擎 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 复古 CRT 屏幕扫描线及暗角光效叠层 -->
  <div class="crt-overlay"></div>

  <!-- 3D 渲染画布容器 -->
  <div id="webgl-container"></div>

  <!-- 交互 UI 悬浮层 -->
  <div class="ui-layer">
    <header class="retro-header">
      <h1 class="pixel-text">★ CAT TAROT 2000 ★</h1>
      <p id="subPrompt" class="pixel-sub">◀ DRAG TO SPREAD CARDS & PICK ONE ▶</p>
    </header>

    <!-- 牌意解读弹出框 -->
    <div id="readingBox" class="reading-box hidden">
      <div id="cardTag" class="card-tag">VI - THE LOVERS</div>
      <p id="cardDesc" class="card-desc">解读内容正在生成...</p>
    </div>

    <!-- 交互控件区 -->
    <footer class="controls">
      <input type="text" id="questionInput" class="pixel-input" placeholder="输入心中困惑 / 今日状态..." value="今日状态？" />
      <div class="btn-group">
        <button id="drawBtn" class="pixel-btn btn-draw" disabled>DRAW CARD</button>
        <button id="resetBtn" class="pixel-btn btn-reset" disabled>RESET</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
